
<!DOCTYPE html>
<html>
<head>
  <title>HTML</title>
  <style>
    body {
      background-color: #00DBEB;
      color: black;
      font-family: Arial, sans-serif;
    }

    h1 {
      background-color: black;
      color: white;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>CSS</h1>

  <p> CSS (Cascading Style Sheets) is the language used to style and lay out web pages. While HTML builds the raw structure of a webpage 
    (like headings, paragraphs, and buttons), CSS controls how those elements look—including colors, fonts, spacing, and screen positioning.
  </p>
  
  <img src="css.png" height="200">
  
</body>
</html>
